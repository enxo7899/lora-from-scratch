[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-from-scratch"
version = "1.0.0"
description = "LoRA fine-tuning written from scratch in numpy on top of a small transformer, with hand-written backpropagation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EmSoft" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
